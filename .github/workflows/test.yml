# test, one of the four checks #5 names. The check-run name is the contract; see
# the note in build.yml for why this job carries no `name:`.
name: test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Read-only. Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain this tree pins
        run: rustup toolchain install

      - name: Run the default suite
        # The default suite and nothing else. It takes no network, opens no
        # display and needs no elevation; that constraint belongs to
        # `docs/testing.md` and is not restated as a flag here. The integration
        # harness is outside this command by construction rather than by a filter
        # written here: `Cargo.toml` declares it with `test = false`, so this
        # invocation neither builds nor runs it.
        #
        # A run that covered less than the whole set says so on its own. Every
        # leg the harness holds prints an ignored line naming what it needs, so
        # the output below cannot be read as a run that covered everything.
        run: cargo test --locked
