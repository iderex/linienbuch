# test, one of the four checks #5 names. The check-run name is the contract; see
# the note in build.yml for why this job carries no `name:` and for why the leg
# itself is not written out here.
name: test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Read-only. Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain this tree pins
        run: rustup toolchain install

      - name: Run the test leg of the gate
        run: cargo run --locked --quiet --bin gate -- test
