# build, one of the four checks #5 names. The check-run name is the contract:
# a required check is matched by its literal name, so renaming it removes it from
# the gate without anything going red. The job below carries no `name:` for that
# reason, because the check-run name then defaults to the job id, which is the
# one place the string appears.
#
# What this leg does is not written here. It is one call into the gate command,
# which is the same implementation the pre-push hook runs, so the two cannot
# disagree about what a build leg is. A test in `src/bin/gate.rs` reads this file
# and refuses any cargo command in it that is not that call.
name: build

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

# Read-only. Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so do not leave the token in .git/config.
          persist-credentials: false

      - name: Install the toolchain this tree pins
        # No version is named here. `rust-toolchain.toml` is the pin and this
        # reads it, so the workflow cannot drift away from the tree's own answer.
        run: rustup toolchain install

      - name: Run the build leg of the gate
        run: cargo run --locked --quiet --bin gate -- build
